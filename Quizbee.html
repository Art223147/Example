<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 2 - IT Quiz Bee (HTML + CSS + JS)</title>
<style>
 
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #1e222a;
    font-family: Consolas, "Courier New", monospace;
  }

  .console {
    width: 760px; max-width: 95%;
    background: #0d1117;
    border: 1px solid #30363d; border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    overflow: hidden;
  }

  .console-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #161b22;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
  .title { margin-left: 8px; font-size: 13px; color: #8b949e; }

  .console-body {
    height: 430px; overflow-y: auto; padding: 16px;
    font-size: 15px; line-height: 1.55; color: #3fb950;
  }

  .line  { white-space: pre-wrap; }
  .echo  { color: #e6edf3; }
  .info  { color: #58a6ff; }
  .warn  { color: #d29922; }
  .error { color: #f85149; }
  .win   { color: #3fb950; font-weight: bold; }

  .console-input {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-top: 1px solid #30363d;
  }
  .prompt { color: #3fb950; font-weight: bold; }
  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e6edf3; font: inherit;
  }
</style>
</head>
<body>

 
  <div class="console">
    <div class="console-header">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">quiz_bee.html — console</span>
    </div>

    <div id="output" class="console-body"></div>

    <form id="inputForm" class="console-input">
      <span class="prompt">&gt;</span>
      <input id="input" type="text" autocomplete="off" autofocus>
    </form>
  </div>

<script>

const output = document.getElementById("output");
const form   = document.getElementById("inputForm");
const input  = document.getElementById("input");

function print(text, cls) {
  const line = document.createElement("div");         
  line.className = "line" + (cls ? " " + cls : "");
  line.textContent = text;
  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}


const questions = [
  { q: "What does HTML stand for?",
    choices: ["A. Hyper Text Markup Language", "B. High Tech Modern Language",
              "C. Hyper Transfer Markup Language", "D. Home Tool Markup Language"],
    answer: "A" },
  { q: "Which company originally developed JavaScript?",
    choices: ["A. Microsoft", "B. Google", "C. Netscape", "D. IBM"],
    answer: "C" },
  { q: "Which keyword declares a constant variable in JavaScript?",
    choices: ["A. var", "B. let", "C. static", "D. const"],
    answer: "D" },
  { q: "Which symbol starts a single-line comment in JavaScript?",
    choices: ["A. #", "B. //", "C. <!--", "D. **"],
    answer: "B" },
  { q: "What does CPU stand for?",
    choices: ["A. Central Processing Unit", "B. Computer Personal Unit",
              "C. Central Process Utility", "D. Control Processing Unit"],
    answer: "A" }
];

let state = "answer";        
let index = 0, score = 0, streak = 0, bestScore = 0;

function showTitle() {
  print("====================================", "info");
  print("   IT QUIZ BEE | JavaScript Game    ", "info");
  print("====================================", "info");
  print("Answer 5 questions by typing the letter (A-D).");
  print("");
}

function showQuestion() {
  const item = questions[index];
  print(`Question ${index + 1}: ${item.q}`, "info");
  for (const c of item.choices) print("   " + c);      
  print("Your answer (A-D):", "warn");
}

function showResults() {
  print("====================================", "info");
  print(`QUIZ COMPLETE! Final score: ${score}/${questions.length}`, "win");

  if (score === 5)      print("Rating: OUTSTANDING! You're a true IT quiz master!");   
  else if (score >= 3)  print("Rating: GREAT JOB! Solid IT knowledge!");
  else if (score >= 1)  print("Rating: NOT BAD! Keep studying!");
  else                  print("Rating: TIME TO REVIEW! Better luck next time!");

  if (score > bestScore) bestScore = score;
  print(`Best score so far: ${bestScore}/${questions.length}`);
  state = "again";
  print("Play again? (y/n):", "warn");
}

form.addEventListener("submit", (e) => {              
  e.preventDefault();
  const value = input.value.trim();
  if (value === "") return;
  print("> " + value, "echo");
  input.value = "";

  if (state === "answer") {
    const ans = value.toUpperCase();                   

    if (!["A", "B", "C", "D"].includes(ans)) {         
      print("Invalid input! Enter a letter from A to D.", "error");
      return;
    }

    const item = questions[index];
    if (ans === item.answer) {                         
      score++; streak++;                               
      print(streak >= 2 ? `CORRECT! +1 point (streak: ${streak})` : "CORRECT! +1 point", "win");
    } else {
      streak = 0;
      print(`WRONG! The correct answer is ${item.answer}.`, "error");
    }
    print("");

    index++;
    if (index < questions.length) showQuestion();
    else showResults();
  }
  else if (state === "again") {
    const v = value.toLowerCase();
    if (v === "y" || v === "yes") {
      index = 0; score = 0; streak = 0;
      state = "answer";
      print("");
      showQuestion();
    } else if (v === "n" || v === "no") {
      print("Thanks for playing! Goodbye!", "info");
      input.disabled = true;
    } else print("Please answer y or n.", "error");
  }
});

document.addEventListener("click", () => input.focus());
showTitle();
showQuestion();
</script>
</body>
</html>
